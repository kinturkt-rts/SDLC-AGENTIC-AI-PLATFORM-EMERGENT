# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/pipeline/#customization
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

variables:
  AWS_REGION: us-east-2
  AGENTCORE_ENTRYPOINT: deploy/agentcore/a2a_server.py
  AGENTCORE_REQUIREMENTS: deploy/agentcore/requirements.txt

stages:
- build
- test
- deploy
- agentcore
- target-app-deploy
- review
- dast
- staging
- canary
- production
- incremental rollout 10%
- incremental rollout 25%
- incremental rollout 50%
- incremental rollout 100%
- performance
- cleanup
sast:
  stage: test

agentcore:deploy:
  stage: agentcore
  image: python:3.12-slim
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - pip install --no-cache-dir bedrock-agentcore-starter-toolkit
    - pip install --no-cache-dir -r deploy/agentcore/requirements.txt
  script:
    - |
      agentcore configure \
        --entrypoint "$AGENTCORE_ENTRYPOINT" \
        --requirements-file "$AGENTCORE_REQUIREMENTS" \
        --protocol A2A \
        --deployment-type container \
        --name "${AGENTCORE_AGENT_NAME}" \
        --region "$AWS_REGION" \
        --disable-memory \
        --non-interactive
    - |
      agentcore deploy --agent "${AGENTCORE_AGENT_NAME}" \
        --env "AGENTCORE_AGENT=${AGENTCORE_AGENT_NAME}" \
        --env "AWS_REGION=${AWS_REGION}" \
        --env "ARTIFACT_STORE=s3" \
        --env "ARTIFACT_S3_BUCKET=${ARTIFACT_S3_BUCKET}" \
        --env "ARTIFACT_DYNAMODB_TABLE=${ARTIFACT_DYNAMODB_TABLE}"
  variables:
    AGENTCORE_AGENT_NAME: architect-agent

# One-off: verify the OIDC role your AWS admin created (gitlab-sdlc-deploy-role)
oidc:test:
  stage: target-app-deploy
  image:
    name: amazon/aws-cli:2.17.62
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^sdlc\//'
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  script:
    - export AWS_ROLE_ARN=arn:aws:iam::061836593297:role/gitlab-sdlc-deploy-role
    - export AWS_WEB_IDENTITY_TOKEN_FILE=$AWS_OIDC_TOKEN
    - aws sts get-caller-identity


# Deploys target-apps on sdlc/<slug> branches. After gitlab-agent publish, the branch
# includes target-apps/<slug>/.sdlc/pipeline-run.json so this job can set PIPELINE_RUN_ID
# and devops-agent can put the live appUrl back onto the same AgentCore/S3 pipeline run
# (frontend DeploySuccessWatcher). Requires CI/CD vars: ARTIFACT_S3_BUCKET, ARTIFACT_DYNAMODB_TABLE.
target-app:deploy:
  stage: target-app-deploy
  image: mcr.microsoft.com/powershell:7.4-debian-12
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TF_VERSION: "1.10.5"
    AWS_ROLE_ARN: arn:aws:iam::061836593297:role/gitlab-sdlc-deploy-role
    ARTIFACT_STORE: "s3"
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^sdlc\//'
  id_tokens:
    AWS_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - export SLUG="${TARGET_APP_SLUG:-${CI_COMMIT_BRANCH#sdlc/}}"
    - 'echo "Target app slug: $SLUG"'
    - export AWS_WEB_IDENTITY_TOKEN_FILE=$AWS_OIDC_TOKEN
    - export AWS_DEFAULT_REGION="$AWS_REGION"
    - |
      for v in ARTIFACT_S3_BUCKET ARTIFACT_DYNAMODB_TABLE; do
        if [ -z "$(printenv "$v")" ]; then
          echo "Missing required CI/CD variable: $v — add it under Settings > CI/CD > Variables. See comment above this job."
          exit 1
        fi
      done
    - apt-get update -qq && apt-get install -y -qq curl unzip python3 python3-pip docker.io git
    - |
      MARKER="backend/target-apps/${SLUG}/.sdlc/pipeline-run.json"
      if [ -z "${PIPELINE_RUN_ID:-}" ] && [ -f "$MARKER" ]; then
        export PIPELINE_RUN_ID="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['runId'])" "$MARKER")"
        echo "Loaded PIPELINE_RUN_ID from $MARKER"
      fi
      if [ -z "${PIPELINE_RUN_ID:-}" ]; then
        echo "WARN: PIPELINE_RUN_ID unset — deploy will still run, but devops S3 handoff will not update the frontend run"
      else
        echo "PIPELINE_RUN_ID=$PIPELINE_RUN_ID"
      fi
    - pip3 install --no-cache-dir --break-system-packages awscli
    - aws sts get-caller-identity || (echo "OIDC role assumption failed — re-run the oidc:test job above to isolate whether this is a role/trust-policy issue." && exit 1)
    - curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/tf.zip
    - unzip -q /tmp/tf.zip -d /usr/local/bin && rm /tmp/tf.zip
    - terraform -version
    - docker info > /dev/null || (echo "Docker daemon not reachable — the runner likely doesn't allow privileged mode for docker:dind. Ask whoever manages the runner to enable it." && exit 1)
    - pip3 install --no-cache-dir --break-system-packages -r backend/requirements.txt
  script:
    - cd backend
    - export PIPELINE_RUN_ID ARTIFACT_STORE
    - python3 agents/devops-agent/devops_agent.py --target-app "$SLUG" --deploy

include:
- template: Auto-DevOps.gitlab-ci.yml